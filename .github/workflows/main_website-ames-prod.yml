# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - website-ames-prod

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Single job: avoids GitHub Actions artifact storage quota
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          # Match Azure App Service WEBSITE_NODE_DEFAULT_VERSION (~22)
          node-version: "22.x"
          cache: npm

      - name: npm install and build
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          npm ci --ignore-scripts
          npm run build --if-present

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID }}

      - name: Configure App Service (Node 22 + Azure PORT)
        run: |
          az webapp config appsettings set \
            --resource-group rg-ames-erp-prod \
            --name website-ames-prod \
            --settings \
              SCM_DO_BUILD_DURING_DEPLOYMENT=false \
              ENABLE_ORYX_BUILD=false \
              WEBSITE_NODE_DEFAULT_VERSION=~22 \
              NODE_ENV=production \
            --output none
          az webapp config set \
            --resource-group rg-ames-erp-prod \
            --name website-ames-prod \
            --startup-file "npm run start:azure" \
            --output none

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: "website-ames-prod"
          slot-name: "Production"
          package: .
          scm-do-build-during-deployment: false
          enable-oryx-build: false

      - name: Restart App Service
        run: |
          az webapp restart \
            --resource-group rg-ames-erp-prod \
            --name website-ames-prod \
            --output none
